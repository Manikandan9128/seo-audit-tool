[project]
name = "seo-audit-tool-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.1",
    "python-multipart>=0.0.12",
    "google-auth>=2.35",
    "google-auth-oauthlib>=1.2",
    "google-api-python-client>=2.149",
    "cryptography>=43.0",
    "itsdangerous>=2.2",
    "google-analytics-data>=0.18",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "jinja2>=3.1",
    "weasyprint>=63",
    "python-pptx>=1.0",
    "httpx>=0.27",
    "google-genai>=0.3",
    "anthropic>=0.40",
    "pdfplumber>=0.11",
    "playwright>=1.47",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
